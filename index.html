<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3a40">
<title>勇敢宁宁的剧本世界 · 官网</title>
<meta name="description" content="勇敢宁宁的剧本世界：横屏单人射击游戏，在一个个剧本里穿梭战斗。安卓安装包下载与联系方式。">
<meta property="og:title" content="勇敢宁宁的剧本世界">
<meta property="og:description" content="横屏单人射击游戏，在一个个剧本里穿梭战斗。">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="img/hero.jpg">
<style>
:root{--teal:#0f3a40;--teal2:#16525a;--gold:#f2b84b;--coral:#e8806a;--cream:#fff4dc;--ink:#2b2118}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--teal);color:var(--cream);line-height:1.7;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:rgba(15,58,64,.92);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:52px}
nav b{font-size:16px;letter-spacing:1px}
nav a.cta{background:var(--gold);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;padding:6px 14px;border-radius:99px}
.hero{text-align:center;padding:36px 0 44px;background:radial-gradient(circle at 50% 22%,rgba(242,184,75,.35),transparent 60%)}
.hero img{width:180px;height:180px;border-radius:40px;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.45);border:3px solid rgba(255,244,220,.25)}
h1{font-size:30px;margin:22px 0 8px;line-height:1.25}
.sub{opacity:.85;font-size:16px;padding:0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.tags span{font-size:13px;border:1px solid rgba(255,244,220,.35);padding:2px 12px;border-radius:99px}
.btn{display:block;width:100%;max-width:340px;margin:12px auto 0;padding:15px 20px;border-radius:16px;font-size:18px;font-weight:700;text-align:center;text-decoration:none;border:0;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,#ffd27a,var(--gold));color:var(--ink);box-shadow:0 6px 0 #b7842a}
.btn.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #b7842a}
.btn.off{background:rgba(255,244,220,.12);color:rgba(255,244,220,.7);box-shadow:none;pointer-events:none}
.note{font-size:13px;opacity:.7;margin-top:10px}
section{padding:40px 0}
section.alt{background:var(--teal2)}
.hero{padding-bottom:56px}
h2{font-size:22px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--coral)}
p.lead{opacity:.85;margin-bottom:18px}
.feat{display:grid;gap:12px}
.feat div{background:rgba(255,244,220,.07);border-radius:16px;padding:14px 16px}
.feat b{color:var(--gold);display:block;margin-bottom:2px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.char{border-radius:16px;overflow:hidden;background:rgba(0,0,0,.2)}
.char i{display:block;aspect-ratio:4/5;background-size:400% auto;background-position:0 4%;background-color:#dfe3ea}
.char span{display:block;text-align:center;padding:8px 4px;font-size:15px}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:4px 0 12px 44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;font-weight:700;display:grid;place-items:center}
.contact{display:grid;gap:12px}
.contact a{display:grid;grid-template-columns:48px 1fr 20px;align-items:center;gap:14px;background:rgba(255,244,220,.1);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit}
.contact a:active{background:rgba(255,244,220,.18)}
.contact svg.logo{width:48px;height:48px;border-radius:12px;display:block}
.contact .txt b{display:block;font-size:17px;line-height:1.3}
.contact .txt span{display:block;font-size:14px;opacity:.75;line-height:1.4}
.contact .go{font-size:22px;opacity:.6;text-align:right}
footer{text-align:center;font-size:12px;opacity:.6;padding:28px 20px 40px}
</style>
</head>
<body>
<nav><div class="wrap"><b>勇敢宁宁</b><a class="cta" href="#contact">联系我</a></div></nav>

<header class="hero"><div class="wrap">
  <img src="img/hero.jpg" alt="勇敢宁宁">
  <h1>勇敢宁宁的剧本世界</h1>
  <p class="sub">翻开一页剧本，走进一个世界。<br>横屏单人射击，闯关、收集、解锁角色。</p>
  <a id="dl-main" class="btn primary" href="#">下载安卓安装包</a>
  <p class="note" id="dl-meta"></p>
  <a id="dl-ios" class="btn off" role="button" aria-disabled="true">苹果 iOS 版即将上线</a>
  <p class="note">安卓安装时如提示「未知来源」，按提示允许浏览器安装即可。</p>
</div></header>

<section class="alt" id="contact"><div class="wrap">
  <h2>联系我</h2>
  <p class="lead">反馈、合作、想看更新，来小红书或抖音找我。</p>
  <div class="contact" id="contact-list"></div>
</div></section>

<footer>© 2026 勇敢宁宁的剧本世界</footer>

<script>
/* 上线前只改这里 */
const SITE = {
  apkUrl: "",          // 例如 "downloads/ningning.apk" 或外链；留空则显示「即将上线」
  apkVersion: "",      // 例如 "0.8"
  apkSize: "",         // 例如 "120 MB"
  contacts: [
    {name: "小红书", user: "白菜抽子", icon: "xhs",    url: "https://xhslink.cn/m/1rXIa0j6C0q"},
    {name: "抖音",   user: "白菜抽子", icon: "douyin", url: "https://v.douyin.com/00NS2U5dRb4/"}
  ]
};

const main = document.getElementById("dl-main"), meta = document.getElementById("dl-meta");
if (SITE.apkUrl) {
  main.href = SITE.apkUrl; main.setAttribute("download", "");
  const m = [SITE.apkVersion && "版本 " + SITE.apkVersion, SITE.apkSize].filter(Boolean).join(" · ");
  meta.textContent = m;
} else {
  main.classList.remove("primary"); main.classList.add("off"); main.textContent = "安卓安装包即将上线"; main.removeAttribute("href");
}
const LOGOS = {
  xhs: '<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#ff2442"/><text x="24" y="29" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="PingFang SC,Microsoft YaHei,sans-serif">小红书</text></svg>',
  douyin: '<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#000"/><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"><path d="M23 12v19.5a5.5 5.5 0 1 1-5.5-5.5M23 12c.6 5 3.8 8 9 8.5" stroke="#25f4ee" transform="translate(-2 -1.5)"/><path d="M23 12v19.5a5.5 5.5 0 1 1-5.5-5.5M23 12c.6 5 3.8 8 9 8.5" stroke="#fe2c55" transform="translate(2 1.5)"/><path d="M23 12v19.5a5.5 5.5 0 1 1-5.5-5.5M23 12c.6 5 3.8 8 9 8.5" stroke="#fff"/></g></svg>'
};
const list = document.getElementById("contact-list");
for (const c of SITE.contacts) {
  const el = document.createElement("a");
  el.href = c.url; el.target = "_blank"; el.rel = "noopener";
  el.setAttribute("aria-label", c.name + " " + c.user);
  el.innerHTML = LOGOS[c.icon] + '<div class="txt"><b></b><span></span></div><div class="go">›</div>';
  el.querySelector("b").textContent = c.name;
  el.querySelector("span").textContent = c.user;
  list.appendChild(el);
}
</script>
</body>
</html>
